# pre-commit hooks (https://pre-commit.com). Install once with `uv run pre-commit install`.
# Ruff and mypy run through uv, so hooks use exactly the versions pinned for the project.
# Update the third-party hook versions with `uv run pre-commit autoupdate`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^docs/architecture/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^docs/architecture/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/architecture/

  # Secret scanner: blocks commits that contain credentials (CONTRIBUTING.md#security-and-data-rules).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict (src/)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
