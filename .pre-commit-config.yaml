repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["src", "tests", "tools"]

  - repo: local
    hooks:
      - id: check-public-wording
        name: Check public wording hygiene
        entry: python tools/check_public_wording.py
        language: system
        pass_filenames: false

      - id: dedupe-sample-check
        name: Check sample bundle has zero duplicates
        entry: node app/scripts/dedupe-sample.mjs --check
        language: system
        pass_filenames: false
        files: ^app/(overlay/public/sample-data/evals\.json|scripts/dedupe-sample\.mjs)$
