name: Bug report
description: Something in the harness, its workflows or its docs does not work as described.
title: "[bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Remove tenant identifiers, user names, tokens and URLs containing IDs** from everything you paste below.
        Report security problems privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Golden set or validation
        - L0 ground truth
        - L1 reference orchestrator
        - L2 declarative agent / Agent Evaluations CLI
        - L3 Chat API / tester sessions
        - Evidence and correlation
        - Evaluators, AI judge, evaluation backends (Foundry or local) or verdicts
        - Results, scorecard or alerts
        - CI/CD workflows
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command, case IDs, persona, surface and run ID if there is one.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (sanitised)
      render: text
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed secrets, tenant identifiers and user names from this report.
          required: true
