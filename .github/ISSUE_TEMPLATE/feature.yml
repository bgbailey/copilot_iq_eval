name: Feature or target request
description: Propose an evaluation check, target adapter, or documentation improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or evaluation gap
      description: Which Copilot or Fabric IQ failure mode or workflow cannot be evaluated today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Expected CLI flags, golden YAML fields, or target interface behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
