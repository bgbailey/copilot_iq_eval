name: Spike
description: Answer an open question about a Microsoft service before code depends on it (Phase 0).
title: "[S?] "
labels: ["type:spike"]
body:
  - type: markdown
    attributes:
      value: |
        A spike ends in an ADR in `docs/decisions/` and, where it confirms a contract, an update to `config/contracts.yaml`.
        **Never paste raw outputs here**: they contain tenant identifiers. Summarise them.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The open question, quoted from PLAN §14 where possible.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      description: Personas, surfaces, prompts and scripts to run.
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: Exit ADR
      placeholder: ADR-00x - <decision title>
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts to confirm
      description: The `TODO(spike-Sx)` entries in config/contracts.yaml this spike resolves.
