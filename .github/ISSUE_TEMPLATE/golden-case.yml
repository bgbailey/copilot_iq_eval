name: Golden case proposal
description: Propose a new test question for the golden set.
title: "[golden] "
labels: ["type:golden-case"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic Contoso terms only: no real customer names, people or figures. See `evals/README.md` for the categories and `evals/golden/cases.yaml` for examples.
  - type: dropdown
    id: category
    attributes:
      label: Category (PLAN §5.2)
      options:
        - Direct single-model
        - Paraphrase group
        - Disambiguation
        - Decoy avoidance
        - Time intelligence
        - RLS persona
        - Cross-model
        - Clarification expected
        - Refuse or out of scope
        - No access
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt and paraphrases
      placeholder: |
        What was gross revenue in FY2025?
        - FY25 gross sales total?
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Persona
      options:
        - exec
        - east
        - noaccess
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: Expected behaviour
      options:
        - answer
        - clarify
        - refuse
        - no_access
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected models, decoys and reference DAX
      description: Which certified model(s) must be used, which must not, and the DAX that computes the expected value.
      render: yaml
  - type: textarea
    id: why
    attributes:
      label: Why this case matters
      description: The routing or accuracy risk it covers.
