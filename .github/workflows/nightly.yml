# =============================================================================================
# Nightly: the full L0-L3 suite, including the declarative agent through the Agent Evaluations
# CLI (PLAN §10 `nightly.yml`, gate policy `nightly` in config/gates.yaml). Every attempt is scored
# on the configured evaluation backend: Microsoft Foundry Evaluations (EVALS_BACKEND=foundry, the
# default, ADR-007) or the local backend on this runner (EVALS_BACKEND=local, ADR-009).
#
# STATUS: wired, disabled until the repository variable EVALS_LIVE_ENABLED is 'true'.
# Needs: P9.2 self-hosted runner (Node 24 for the CLI), P2.3 auth, P2.6 runner, the backend (P2.7 Foundry
# or P2.8 local), P4.3 CLI adapter, P6.1 Chat API adapter, P8.1 results sink, P8.3 alerting.
# See docs/getting-started.md.
#
# 07:00 UTC is 02:00 Eastern Standard Time (03:00 while daylight saving time is in effect).
# =============================================================================================
name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Evaluation backend: foundry | local (docs/evaluation-paths.md). Set the repository variable to switch.
  EVALS_BACKEND: ${{ vars.EVALS_BACKEND || 'foundry' }}

jobs:
  eval-full:
    name: eval-l0-l3
    if: ${{ vars.EVALS_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, copilot-evals]
    environment: eval-demo
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Set up Node 24 for the Agent Evaluations CLI
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the Agent Evaluations CLI
        # Pin the version recorded in ADR-003 once spike S3 has run.
        run: npm install --global @microsoft/m365-copilot-eval

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: uv sync --locked

      - name: Check persona tokens
        run: uv run evals auth check --personas exec,east,noaccess

      - name: Register Foundry evaluators (content-addressed, idempotent)
        if: env.EVALS_BACKEND == 'foundry'
        run: uv run evals foundry sync

      - name: Run L0-L3 suite (scored on the ${{ env.EVALS_BACKEND }} backend)
        run: uv run evals run --suite nightly --layers L0,L1,L2,L3 --k 3 --backend "$EVALS_BACKEND" --out out/

      - name: Job summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-nightly-${{ github.run_id }}
          path: out/

      - name: Publish results to OneLake
        if: always()
        run: uv run evals publish --out out/ --sink onelake

      # TODO(P8.3): when the gate fails (if: failure()), post out/summary.md to the Teams Workflows
      # webhook whose URL is stored in Key Vault (settings: alerts.teams_webhook_keyvault_name).
