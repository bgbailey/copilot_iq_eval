# =============================================================================================
# Reconcile: harvest yesterday's Purview audit records and Interaction Export data, attach them
# to attempts as evidence and refresh the access-point consistency view (PLAN §10 `reconcile.yml`).
#
# STATUS: wired, disabled until the repository variable EVALS_LIVE_ENABLED is 'true'.
# Needs: P6.2 (Interaction Export harvester), P6.3 (audit evidence), P8.1 (results sink).
# The reconcile command is named by P6.2/P6.3; update the harvest step to match.
#
# 13:00 UTC is 08:00 Eastern Standard Time.
# =============================================================================================
name: reconcile

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: audit-and-export-reconciliation
    if: ${{ vars.EVALS_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, copilot-evals]
    environment: eval-demo
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: uv sync --locked

      - name: Harvest audit and Interaction Export for the previous day
        run: uv run evals reconcile --day yesterday --out out/

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reconcile-${{ github.run_id }}
          path: out/

      - name: Publish results to OneLake
        if: always()
        run: uv run evals publish --out out/ --sink onelake
