# =============================================================================================
# PR gate: the L0 + L1 evaluation suite on every pull request that can change behaviour
# (PLAN §10 `pr-gate.yml`, gate policy in config/gates.yaml). This workflow drives the surfaces,
# scores the run on the configured evaluation backend and applies the gate to the results:
#   EVALS_BACKEND=foundry (default)  Microsoft Foundry Evaluations runs the evaluators (ADR-007)
#   EVALS_BACKEND=local              the evaluators run on this runner, with no Foundry project (ADR-009)
#
# STATUS: wired, disabled. The job runs only when the repository variable EVALS_LIVE_ENABLED is
# 'true'. Turn it on after P9.2 (self-hosted runner) and once the harness commands below exist:
#   evals auth check (P2.3) · evals run (P2.6, L1 from P3) · evals publish (P8.1)
#   and the backend: evals foundry sync (P2.7) or the local judge client (P2.8)
# Then make the "eval-l0-l1" check a required status check. See docs/getting-started.md.
#
# Runs on the self-hosted runner because persona tokens and tenant access live there. Azure
# login uses GitHub OIDC federation: no client secrets are stored in GitHub. The identity needs
# Cognitive Services OpenAI User on the model resource (PLAN §6 T19) and, on the Foundry backend,
# the Foundry User role at the Foundry account scope (T18).
# =============================================================================================
name: pr-gate

on:
  pull_request:
    paths: ["evals/**", "agents/**", "fabric/**", "src/**", "config/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Evaluation backend: foundry | local (docs/evaluation-paths.md). Set the repository variable to switch.
  EVALS_BACKEND: ${{ vars.EVALS_BACKEND || 'foundry' }}

jobs:
  eval-l0-l1:
    name: eval-l0-l1
    if: ${{ vars.EVALS_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, copilot-evals]
    environment: eval-demo
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: uv sync --locked

      - name: Check persona tokens
        run: uv run evals auth check --personas exec,east,noaccess

      - name: Register Foundry evaluators (content-addressed, idempotent)
        if: env.EVALS_BACKEND == 'foundry'
        run: uv run evals foundry sync

      - name: Run L0 + L1 suite (scored on the ${{ env.EVALS_BACKEND }} backend)
        run: uv run evals run --suite pr --layers L0,L1 --k 3 --backend "$EVALS_BACKEND" --out out/

      - name: Job summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-pr-${{ github.run_id }}
          path: out/

      - name: Publish results to OneLake
        if: always()
        run: uv run evals publish --out out/ --sink onelake
