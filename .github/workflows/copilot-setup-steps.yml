# =============================================================================================
# Development environment for the GitHub Copilot cloud agent.
#
# Copilot runs these steps before it starts work on an assigned issue, so it can lint, type-check
# and test its changes exactly as CI does. The job MUST be called `copilot-setup-steps`.
# https://docs.github.com/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# The workflow also runs on its own when this file changes, so a broken setup shows up as a
# failed check, and it can be run manually from the Actions tab.
# =============================================================================================
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      - name: Smoke-test the toolchain
        run: |
          uv run evals --version
          uv run evals validate
