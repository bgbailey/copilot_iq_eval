name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: One offline mock smoke (no sign-in or cloud calls)
        run: python tools/rehearse_demo.py --mock --run-id offline-smoke --questions Q01,Q03 --max-questions 2 --max-judge-calls 4 --output-dir build/offline-smoke
      - name: Generated files are up to date
        run: |
          python tools/gen_app_contract.py
          python -m cfeval kql --out kql/setup.kql
          git diff --exit-code

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the preview toolchain
        working-directory: app/standalone
        run: npm ci --no-audit --no-fund
      - name: Reference entities are up to date
        run: |
          node app/scripts/generate-entities.mjs --metadata app/connectors/evals/metadata.example.json --out app/connectors/evals
          git diff --exit-code
      - name: Type check and build
        working-directory: app/standalone
        run: |
          npm run typecheck
          npm run build
