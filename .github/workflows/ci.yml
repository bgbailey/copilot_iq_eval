name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify tracked file sizes (< 500 KB)
        run: >
          python -c "import os, subprocess, sys;
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines();
          over = [(f, os.path.getsize(f)) for f in files if os.path.exists(f) and os.path.getsize(f) > 512000];
          print('\n'.join(f'{f}: {sz} bytes (> 512000)' for f, sz in over)) if over else print(f'Checked {len(files)} tracked files (all <= 512000 bytes).');
          sys.exit(1 if over else 0)"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Typecheck with mypy
        run: mypy src/cfeval

      - name: Run pytest with coverage and JUnit XML
        run: pytest -m "not live" --cov=cfeval --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: Lint golden suites
        run: python -m cfeval golden-lint

      - name: Calibrate judge (offline mock)
        run: python -m cfeval calibrate-judge --mock --min-kappa 0.70

      - name: Run offline strict smoke check
        run: python -m cfeval run --strict --mock --profile tuned --no-publish

      - name: Verify public wording hygiene
        run: python tools/check_public_wording.py

      - name: Verify documentation links
        run: python tools/check_docs_links.py

      - name: Verify generated files have not drifted
        run: |
          python -m cfeval kql --out kql/setup.kql
          python tools/gen_app_contract.py
          python tools/gen_reference_docs.py --check
          git diff --exit-code kql/setup.kql app/overlay/src/eval/generated/contract.ts app/connectors/evals/metadata.example.json

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload coverage and JUnit XML artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  scorecard-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/standalone/package-lock.json

      - name: Verify sample bundle has no duplicate rows
        run: node app/scripts/dedupe-sample.mjs --check

      - name: Install standalone dependencies
        working-directory: app/standalone
        run: npm ci

      - name: Run scorecard unit tests
        working-directory: app/standalone
        run: npm test

      - name: Typecheck scorecard app
        working-directory: app/standalone
        run: npm run typecheck

      - name: Build scorecard app
        working-directory: app/standalone
        run: npm run build

      - name: Upload scorecard dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-app-dist
          path: app/standalone/dist

