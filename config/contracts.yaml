# --- Joint Work IQ + Fabric IQ cases (PLAN §2.1 finding 13, §4.4, ADR-010) -------------------------
work_iq_api:
  status: documented          # confirm with spike S8 -> ADR-011
  adr: null
  sources: [S42, S43, S44]
  create_conversation: POST https://workiq.svc.cloud.microsoft/rest/conversations
  chat: POST https://workiq.svc.cloud.microsoft/rest/conversations/{conversation_id}/chat
  other_protocols: [https://workiq.svc.cloud.microsoft/mcp, https://workiq.svc.cloud.microsoft/a2a]
  auth:
    flow: delegated                          # application permissions are not supported
    scopes: [api://workiq.svc.cloud.microsoft/WorkIQAgent.Ask]
  tenant_prerequisites: Work IQ enabled for the tenant, with usage-based billing (PLAN §6 T21)
  request_fields:                            # same shape as the Copilot Chat API
    message: message.text
    time_zone: locationHint.timeZone
    contextual_files: contextualResources.files[].uri
    additional_context: additionalContext[].text
  response_fields:
    messages: messages
    text: text
    attributions: attributions
  limitations: subject to the limits of the Microsoft 365 Copilot semantic index; web grounding is on by default
  power_bi_source: null                      # TODO(spike-S8): does it ever answer from Power BI / Fabric data?

graph_sharepoint_files:
  status: documented
  adr: null
  sources: [S53]
  site_by_path: GET https://graph.microsoft.com/v1.0/sites/{hostname}:/{site_path}
  default_drive: GET https://graph.microsoft.com/v1.0/sites/{site_id}/drive
  create_folder: POST https://graph.microsoft.com/v1.0/drives/{drive_id}/items/{parent_id}/children   # body {name, folder: {}, "@microsoft.graph.conflictBehavior": "fail"}; 409 when it exists
  item_by_path: GET https://graph.microsoft.com/v1.0/drives/{drive_id}/root:/{path}
  upload_small_file: PUT https://graph.microsoft.com/v1.0/drives/{drive_id}/items/{parent_id}:/{file_name}:/content?@microsoft.graph.conflictBehavior=replace   # up to 250 MB
  search: POST https://graph.microsoft.com/v1.0/search/query   # spike S8: when a seeded document becomes findable
  auth:
    flow: delegated                          # the operator running `evals deploy workiq`
    scopes: [Sites.ReadWrite.All]            # Files.ReadWrite.All also works for team sites the operator can edit
  indexing_latency_s: null                   # TODO(spike-S8): upload to findable by Copilot

# --- Deployment: `evals deploy fabric` (PLAN §2.1 finding 14, §8 P1.8) -------------------------------
fabric_rest:
  status: documented
  adr: null
  sources: [S45, S46, S47, S48]
  base_url: https://api.fabric.microsoft.com/v1
  auth:
    flow: delegated                          # the operator; copilot-eval-setup app (infra/entra)
    scope: https://api.fabric.microsoft.com/.default
  capacities: GET /capacities
  workspaces: {list: GET /workspaces, create: "POST /workspaces {displayName, capacityId, description}",
               assign_to_capacity: "POST /workspaces/{workspace_id}/assignToCapacity {capacityId}"}
  role_assignments: "POST /workspaces/{workspace_id}/roleAssignments {principal: {id, type}, role}"   # Viewer keeps RLS in force
  items_by_type: GET /workspaces/{workspace_id}/items?type={item_type}   # Lakehouse, Notebook, Monitoring, Eventhouse, KQLDatabase
  lakehouse_create: "POST /workspaces/{workspace_id}/lakehouses {displayName, description}"         # no creationPayload: no schemas
  notebook_create: "POST /workspaces/{workspace_id}/notebooks {displayName, definition: {format: ipynb, parts: [{path: notebook-content.ipynb, payload, payloadType: InlineBase64}]}}"
  notebook_update: POST /workspaces/{workspace_id}/notebooks/{notebook_id}/updateDefinition
  notebook_run:
    request: POST /workspaces/{workspace_id}/notebooks/{notebook_id}/jobs/execute/instances?beta=false
    parameters: "parameters[] {name, value, type}; type Text | Integer | Number | Boolean | DateTime | Guid | Automatic; names match the parameters cell"
    default_lakehouse: "executionData.computeConfiguration.defaultLakehouse {referenceType: ById, itemId, workspaceId}"
    response: 202 with Location (the job instance) and Retry-After (wait at least this long before the first poll)
    job_statuses: [NotStarted, InProgress, Completed, Failed, Cancelled, Deduped]
    scopes: [Notebook.Execute.All, Item.Execute.All]
  long_running_operations: "202 with Location (GET /operations/{id}: NotStarted | Running | Succeeded | Failed), x-ms-operation-id and Retry-After; on Succeeded, Location points to /result"
  monitoring:                                # preview
    create: "POST /workspaces/{workspace_id}/monitoringItems {displayName, definition: {format: MonitoringV1, parts: [{path: MonitoringProperties.json}]}}"
    enable: POST /workspaces/{workspace_id}/monitoringItems/{monitoring_id}/enableDataCollection   # 200 also when already on; 409 when another item collects
    caller_role: Contributor to create, Admin to enable
  no_api: [endorsement, Prep data for AI]   # stay manual (PLAN §8 P1.4)

power_bi_dataset_users:
  status: documented
  adr: null
  sources: [S49]
  endpoint: POST https://api.powerbi.com/v1.0/myorg/groups/{workspace_id}/datasets/{dataset_id}/users
  body: {identifier: "{upn}", principalType: User, datasetUserAccessRight: ReadExplore}   # Read + Build
  auth:
    flow: delegated
    scopes: [https://analysis.windows.net/powerbi/api/Dataset.ReadWrite.All]
  caller_needs: ReadReshare on the dataset (a workspace Admin or Member has it)
  service_principals_supported: false

semantic_link_labs:
  status: documented          # the first nb_02 run confirms it
  adr: null
  sources: [S50]
  package: semantic-link-labs==0.18.0       # pinned in nb_02; installed inline if the runtime lacks it
  generate_model: "sempy_labs.directlake.generate_direct_lake_semantic_model(dataset, tables={model table: lakehouse table}, source, source_type='Lakehouse', source_workspace, use_sql_endpoint, workspace, refresh, overwrite)"
  edit_model: "sempy_labs.tom.connect_semantic_model(dataset, workspace, readonly=False)"   # add_relationship, add_measure, mark_as_date_table, add_role, set_rls, add_role_member
  query_as_user: "sempy.fabric.evaluate_dax(dataset, dax_string, workspace, effective_user_name)"
  inline_install_in_job_runs: null          # Fabric disables %pip in pipeline runs unless _inlineInstallationEnabled is passed; confirm for job API runs
