  pairing_key: requestId
  access_point_field: appClass
  excludes_copilot_studio_agents: true
  latency: null                              # TODO(spike-S5)

purview_audit:
  status: documented          # confirm with spike S5 -> ADR-005
  adr: null
  sources: [S24, S26]
  record_type: CopilotInteraction
  fields: [AppHost, AgentId, AgentName, AccessedResources, AISystemPlugin]
  graph_query_api: https://graph.microsoft.com/v1.0/security/auditLog/queries
  power_bi_items_in_accessed_resources: null # TODO(spike-S5)
  latency: null                              # TODO(spike-S5)

