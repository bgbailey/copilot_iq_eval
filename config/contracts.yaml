# =============================================================================================
# API contracts registry
#
# The ONLY place adapters may read endpoints, scopes, headers and field names from
# (.github/copilot-instructions.md: "Never invent API endpoints, scopes, headers or response fields").
#
# How entries get here
# - status: documented  -> taken from docs/PLAN.md §9, which cites Microsoft Learn (PLAN §16, checked
#                          3 Nov 2026). Good enough to build against, not yet observed in our tenant.
# - status: confirmed   -> observed in the demo tenant by a Phase 0 spike and recorded in an ADR
#                          (docs/decisions/ADR-00x-*.md). Set `adr:` when you confirm an entry.
# - null + TODO(spike-Sx) -> unknown until that spike runs. Code that needs the value must stop and
#                          leave a TODO(spike-Sx) rather than guess.
#
# Sources (Sxx) refer to the table in PLAN §16. Never put tenant IDs, URLs with GUIDs or secrets here:
# placeholders in {braces} are filled in at run time.
# =============================================================================================

version: 1

# --- Foundry backend: Microsoft Foundry Evaluations (PLAN §2.1 finding 11, §9.11, ADR-007, ADR-009) ---
# Used only when [evaluation] backend = "foundry". The local backend mirrors these semantics (PLAN §9.12).
foundry_evaluations:
  status: documented          # confirm with spike S7 -> ADR-008
  adr: null                   # ADR-007 records the decision to use Foundry; ADR-008 will confirm this contract
  sources: [S33, S34, S35, S36, S37, S38, S39, S40]
  sdk:
    package: "azure-ai-projects>=2.2.0"
    project_client: AIProjectClient(endpoint, credential=DefaultAzureCredential())
    openai_client: project_client.get_openai_client()
  project_endpoint: https://{account}.services.ai.azure.com/api/projects/{project}
  auth:
    flow: entra_id            # the runner signs in with GitHub OIDC; no keys
    role: Foundry User        # formerly "Azure AI User"; at the Foundry account scope when a run calls a model deployment
  evaluator_catalog:
    create_version: project_client.beta.evaluators.create_version(name, evaluator_version)  # REST POST /evaluators/{name}/versions; version auto-increments
    delete_version: project_client.beta.evaluators.delete_version(name, version)
    definition_types: [code, prompt, endpoint]
    definition_fields:
      code: [type, code_text, init_parameters, metrics, data_schema]
      prompt: [type, prompt_text, init_parameters, metrics, data_schema]
    metadata: string key-value pairs; we store content_sha256 and git_sha
    pin_version_in_testing_criteria: null     # TODO(spike-S7): until confirmed, catalog names are content-addressed
  code_evaluator:
    entry_point: "grade(sample: dict, item: dict) -> float"
    score_range: [0.0, 1.0]
    metric: {type: continuous, desirable_direction: increase, min_value: 0.0, max_value: 1.0}
    required_init_parameters: [deployment_name, pass_threshold]
    row_access: item                          # the whole dataset row
    target_output_access: item["sample"]["output_text"]   # documented as subject to change
    on_exception_or_timeout: the row's result is 0.0 and it is marked as an error in the report
    sandbox: {max_code_kb: 256, max_seconds_per_call: 120, network: false, memory_gb: 2, disk_gb: 1, cpu_cores: 2}
    packages: {numpy: 2.2.4, scipy: 1.15.2, pandas: 2.2.3, scikit-learn: 1.6.1, rapidfuzz: 3.10.1, sympy: 1.13.3,
               jsonschema: 4.23.0, pydantic: 2.10.6, deepdiff: 8.4.2, nltk: 3.9.1, rouge-score: 0.1.2, pyyaml: 6.0.2}
    evaluation_levels: [turn]
    python_version: null                      # TODO(spike-S7): 3.10 or later is implied by numpy 2.2 and scipy 1.15
    error_in_output_items: null               # TODO(spike-S7): how an errored row differs from a 0.0 failure
    whole_row_in_item: null                   # TODO(spike-S7): confirm item holds every row field without data_mapping
  prompt_evaluator:
    output: '{"result": <int ordinal | float continuous | bool binary>, "reason": "<text>"}'
    template_variables: "{{name}}, filled from data_mapping"
    required_init_parameters: [deployment_name, threshold]
    threshold_semantics: null                 # TODO(spike-S7): score >= threshold passes?
  endpoint_evaluator:                         # not used today; held in reserve for a check that needs a live lookup
    request_schema_version: "0.0.1"
    response_fields: [score, reason, status, properties, threshold, passed, schema_version, error]
    timeout_s: 30
    auth: [api_key, entra_id]                 # through a project connection
  eval:
    create: openai_client.evals.create(name, data_source_config, testing_criteria)
    data_source_config: {type: custom, item_schema: "<JSON Schema>", include_sample_schema: true}
    testing_criterion: {type: azure_ai_evaluator, fields: [name, evaluator_name, data_mapping, initialization_parameters]}
    nested_and_nullable_item_schema: null     # TODO(spike-S7)
  dataset:
    upload: project_client.datasets.upload_file(name, version, file_path).id
    formats: [jsonl, csv]
    max_row_mb: 2
    max_rows_per_run: 100000
  run:
    create: openai_client.evals.runs.create(eval_id, name, data_source)
    data_sources:
      dataset: {type: jsonl, source: {type: file_id, id: "{dataset_id}"}}
      model_target: {type: azure_ai_target_completions, input_messages: {type: template}, target: {type: azure_ai_model, sampling_params: [top_p, max_completion_tokens]}}
    poll: openai_client.evals.runs.retrieve(run_id, eval_id)
    terminal_statuses: [completed, failed, canceled]
    output_items: openai_client.evals.runs.output_items.list(run_id, eval_id)   # iterating reads every page
    item_result_fields: [type, name, metric, score, label, reason, threshold, passed]
    run_fields: [status, error, result_counts, per_testing_criteria_results, report_url, latency, estimated_cost]
    cancel: openai_client.evals.runs.cancel(run_id, eval_id)
    rate_limits: run creation is limited per tenant, subscription and project; 429 with Retry-After
  regions: batch evaluations are available in listed regions only (S39)
  builtin_tool_call_evaluators_support_fabric_data_agent: false
  cost_per_100_rows: null                     # TODO(spike-S7)

# --- Model calls: the L1 orchestrator (both backends) and the local backend's AI judge --------------
# (PLAN §2.1 finding 12, §9.3.1, §9.12, ADR-009)
azure_openai_v1:
  status: documented
  adr: null
  sources: [S41]
  base_url: https://{resource}.openai.azure.com/openai/v1/     # a Foundry resource's https://{resource}.services.ai.azure.com/openai/v1/ also works
  api_version: null                                          # not used by the v1 API
  sdk:
    package: openai                                          # the standard OpenAI() client, not AzureOpenAI()
    client: OpenAI(base_url, api_key=token_provider)
    token_provider: get_bearer_token_provider(DefaultAzureCredential(), "https://ai.azure.com/.default")
  auth:
    flow: entra_id                                           # the client refreshes tokens itself; no keys
    scope: https://ai.azure.com/.default
    role: Foundry User on a Foundry (AIServices) resource; Cognitive Services OpenAI User on an Azure OpenAI resource  # PLAN §6 T19, infra/azure
  responses: client.responses.create(model, input)           # recommended for Azure OpenAI models; reply text in output_text
  chat_completions: client.chat.completions.create(model, messages)
  model: the deployment name                                 # settings.azure_openai.orchestrator_model / judge_model

# --- L1: Fabric IQ MCP server (PLAN §2.1 finding 2, §9.3.1) --------------------------------------
fabric_iq_mcp:
  status: documented          # confirm with spike S6 -> ADR-006
  adr: null
  sources: [S10]
  endpoint: https://fabriciq.svc.cloud.microsoft/v1/mcp/fabriciq
  endpoint_private_link: https://api.fabric.microsoft.com/v1/mcp/fabriciq
  transport: streamable_http
  headers:
    X-Variants: Fabric.Routing.FabricIQ.V1   # send on initialize, tools/list and tools/call
  auth:
    flow: delegated                          # service principals are not supported
    resource: https://analysis.windows.net/powerbi/api
    scopes:
      - https://analysis.windows.net/powerbi/api/Item.Read.All
      - https://analysis.windows.net/powerbi/api/Item.Execute.All
  tools: [DiscoverArtifacts, ResolveFabricItem, GetReportMetadata, GetSemanticModelSchema, ValueSearch, ExecuteQuery]
  execute_query:
    targets_one_model_per_call: true
    default_row_limit: 250
    semantic_model_argument: null            # TODO(spike-S6): exact argument name from tools/list
    query_argument: null                     # TODO(spike-S6): exact argument name from tools/list

# --- L0: ground truth (PLAN §9.4) ---------------------------------------------------------------
power_bi_execute_queries:
  status: documented
  adr: null
  sources: [S27]
  endpoint: https://api.powerbi.com/v1.0/myorg/groups/{workspace_id}/datasets/{dataset_id}/executeQueries
  refreshes_endpoint: https://api.powerbi.com/v1.0/myorg/groups/{workspace_id}/datasets/{dataset_id}/refreshes?$top=1
  auth:
    flow: delegated                          # service principals are not supported on RLS models
    scopes:
      - https://analysis.windows.net/powerbi/api/Dataset.Read.All
  request_fields:
    queries: queries[].query                 # exactly one query per call
    include_nulls: serializerSettings.includeNulls
    impersonation: impersonatedUserName
  response_rows: results[0].tables[0].rows
  limits:
    queries_per_call: 1
    requests_per_minute_per_user: 120
    max_rows: 100000
    max_values: 1000000
    max_response_mb: 15
  tenant_setting: Dataset Execute Queries REST API   # PLAN §6 T9
  query_marker: "// eval-gt case={case_id}"          # excluded from engine-log correlation

# --- Routing oracle: workspace monitoring (PLAN §2.1 finding 8, §9.5) -----------------------------
semantic_model_logs:
  status: documented          # confirm with spike S2 -> ADR-002
  adr: null
  sources: [S23]
  table: SemanticModelLogs
  columns: [Timestamp, WorkspaceId, ItemId, ItemName, ItemKind, OperationName, EventText, ExecutingUser,
            ApplicationName, ApplicationContext, DurationMs, CorrelationId]
  query_end_operation: QueryEnd
  markers:
    ground_truth: eval-gt
    heartbeat: eval-hb
  heartbeat_dax: 'EVALUATE ROW("hb", 1) // eval-hb {attempt_id}'
  application_name_signatures: null          # TODO(spike-S2): ApplicationName/ApplicationContext per surface
  ingestion_latency_s: {p50: null, p95: null}  # TODO(spike-S2)
  heartbeat_implies_completeness: null       # TODO(spike-S2): if false, use a fixed delay from p95

# --- L2: Agent Evaluations CLI (PLAN §2.1 finding 5, §9.3.2) -------------------------------------
agent_evaluations_cli:
  status: documented          # preview; confirm with spike S3 -> ADR-003
  adr: null
  sources: [S11, S12, S13]
  package: "@microsoft/m365-copilot-eval"
  command: runevals
  alternative_command: wiqd agent eval        # Work IQ Dev Tools; `wiqd agent validate` checks manifests
  environment: [TENANT_ID, AZURE_AI_PROJECT_ENDPOINT, AZURE_AI_MODEL_NAME, M365_AGENT_ID]   # or M365_TITLE_ID
  default_judge_model: gpt-5-mini
  flags:
    prompts_file: --prompts-file
    output: --output
  dataset_schema_version: "1.6.0"
  dataset_item_fields: [testId, category, prompt, expected_response, evaluators, evaluators_mode]
  evaluators: [Relevance, Coherence, Groundedness, Similarity, RetrievalQuery, RetrievalResult, Citations,
               ExactMatch, PartialMatch]
  persona_profile: null                      # TODO(spike-S3): headless sign-in and token cache per persona
  report_field_mapping: null                 # TODO(spike-S3): answer text, citations, timestamps in the JSON report
  citations_include_power_bi_urls: null      # TODO(spike-S3)

# --- L3: Microsoft 365 Copilot Chat API, beta (PLAN §2.1 finding 4, §9.3.3) ------------------------
copilot_chat_api:
  status: documented          # beta; confirm with spike S1 -> ADR-001
  adr: null
  sources: [S1, S2, S3, S4]
  create_conversation: POST https://graph.microsoft.com/beta/copilot/conversations
  chat: POST https://graph.microsoft.com/beta/copilot/conversations/{conversation_id}/chat
  chat_over_stream: POST https://graph.microsoft.com/beta/copilot/conversations/{conversation_id}/chatOverStream
  auth:
    flow: delegated                          # application permissions are not supported
    scopes: [Sites.Read.All, Mail.Read, People.Read.All, OnlineMeetingTranscript.Read.All, Chat.Read,
             ChannelMessage.Read.All, ExternalItem.Read.All]   # all of them are required
  request_fields:
    message: message.text
    time_zone: locationHint.timeZone
    additional_context: additionalContext[].text
    web_grounding: contextualResources.webContext.isWebEnabled
    contextual_files: contextualResources.files[].uri        # OneDrive or SharePoint file URLs (spike S8)
  response_fields:
    messages: messages
    text: text
    attributions: attributions
    attribution_fields: [attributionType, attributionSource, providerDisplayName, seeMoreWebUrl]
  agent_selection_supported: false
  triggers_fabric_iq: null                   # TODO(spike-S1): does it reach Power BI data answering?
  attributions_include_power_bi_links: null  # TODO(spike-S1)

# --- L3: Interaction Export (PLAN §9.3.6) and Purview audit (PLAN §2.1 finding 9) -----------------
