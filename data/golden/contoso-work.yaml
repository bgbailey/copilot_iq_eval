  rel_tol: 0.0
  abs_tol: 0.1
  expected_answer: Regional VPs may approve discounts up to 12.0% without CFO sign-off.
  criticality: critical
  paraphrases:
  - Up to what discount percent can a regional VP sign off before CFO approval is required?
  - Check FY25 Pricing Committee Notes for the regional VP discount authority ceiling.
  notes: Discount authority threshold in pricing minutes
