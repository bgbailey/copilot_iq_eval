version: 2
name: Contoso Work IQ Evaluation Suite
description: 22 synthetic Microsoft 365 Work IQ grounding questions spanning SharePoint strategy documents, OneDrive
  board decks, Teams meeting recaps, and Outlook escalation threads.
defaults:
  surface: work-iq
  gates:
  - value
  - artifact
  rel_tol: 0.005
questions:
- id: W01
  question: According to the FY25 Pricing Committee Notes, what percentage list-price uplift was approved for Cloud
    Platform enterprise tiers effective Q3 FY25?
  case_type: scalar
  category: pricing-policy
  persona: finance-analyst
  intent:
    measure: document_scalar_lookup
  tags:
  - pricing
  - sharepoint
  - fy25
  expected_artifact: FY25 Pricing Committee Notes.docx
  artifact_aliases:
  - fy25-pricing-committee-notes.md
  decoys:
  - FY25 Pricing Committee Notes - DRAFT v0.1.docx
  expected: 6.5
  unit: percent
  rel_tol: 0.0
  abs_tol: 0.1
  expected_answer: The Pricing Committee approved a 6.5% enterprise list-price uplift for Cloud Platform effective
    Q3 FY25.
  criticality: critical
  paraphrases:
  - What Cloud Platform list-price increase percentage is documented in FY25 Pricing Committee Notes.docx?
  - In the approved FY25 pricing committee minutes, by what percent did Cloud Platform enterprise list prices rise
    in Q3?
  notes: Grounded in SharePoint pricing committee document
