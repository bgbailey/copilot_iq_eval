# =============================================================================================
# Golden test cases (PLAN §5)
#
# Each case is one business question, the persona who asks it, and what a correct response
# looks like: the behaviour, the semantic model(s) it must use, the decoys it must avoid, and
# the expected value with its tolerance. Expected values are never written here: they are
# computed live from `reference_dax`, run as the persona, before every case (PLAN §5.3, §9.4).
#
# This is the seed set from PLAN §5.1 and Appendix B (10 cases) plus four joint Work IQ + Fabric IQ
# cases (PLAN §4.4, ADR-010). Task P1.8 grows it to the 48-case target in PLAN §5.2 (at least 40 for
# the demo exit criteria).
#
# Field guide (schema: src/copilot_evals/schemas.py, class Case)
#   id            <PREFIX>-<NNN>; stable and never reused
#   intent        groups paraphrases of the same question
#   persona       key in personas.yaml
#   surfaces      omit to run on every enabled surface
#   expect
#     behavior    answer | clarify | refuse | no_access
#     models      keys in models.yaml (ItemIds are resolved at run time)
#     route_mode  exclusive | includes | any_of
#     decoys      models that must not be queried
#     doc_decoys  documents (models.yaml `documents`, role decoy) that must not be cited
#     work_sources  documents (role source) the answer must cite, for joint Work IQ cases
#     work_facts  <document>.<fact> figures from those documents the answer must state
#     citation    required | optional
#     value       scalar answer: reference_dax (or composite), unit, tolerance
#     table       keyed answer: reference_dax returning (key, value) rows, unit, match, tolerance
#   runs          k, attempts per surface and persona
#   criticality   critical cases must pass k of k
#
# Rules: reference DAX uses the business-friendly names in PLAN §4.2; synthetic data only.
# Check your edits with:  uv run evals validate --strict
# =============================================================================================

# --- Direct single-model ------------------------------------------------------------------------

- id: REV-001
  intent: gross_revenue_fy
  prompt: "What was gross revenue in FY2025?"
  paraphrases:
    - "How much did we sell in FY25 before discounts and returns?"
    - "FY2025 gross sales total?"
  persona: exec
  surfaces: [ref_mcp, agent_cli, chat_api]
  expect:
    behavior: answer
    models: [sales_analytics]
    route_mode: includes
    decoys: [sales_sandbox, finance]
    doc_decoys: [fy25_revenue_draft]
    citation: required
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2025"))
      unit: currency_usd
      tolerance: {rel: 0.005, abs: 0, display_aware: true, max_display_rel: 0.05}
  runs: 3
  criticality: critical
  tags: [single-model, fiscal-time]
  notes: "Policy: revenue = gross unless 'net' is stated"

- id: FIN-002
  intent: net_revenue_fy
  prompt: "What was net revenue for FY2025 after discounts and returns?"
  persona: exec
  expect:
    behavior: answer
    models: [finance]
    route_mode: includes
    decoys: [sales_sandbox]
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Net Revenue], 'Date'[Fiscal Year] = "FY2025"))
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: critical
  tags: [single-model, disambiguation]

- id: OPS-003
  intent: sev1_by_region
  prompt: "How many Sev1 incidents did each region have in Q2 FY2025?"
  persona: exec
  expect:
    behavior: answer
    models: [service_operations]
    route_mode: exclusive
    table:
      reference_dax: |
        EVALUATE SUMMARIZECOLUMNS('Region'[Region], FILTER(ALL('Date'), 'Date'[Fiscal Quarter] = "FY2025 Q2"), "v", [Sev1 Incidents])
      unit: count
      match: all_keys
      tolerance: {abs: 0}
  runs: 3
  criticality: standard
  tags: [single-model, group-by]

# --- Disambiguation -------------------------------------------------------------------------------

