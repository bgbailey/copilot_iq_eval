# --- Decoy avoidance ------------------------------------------------------------------------------

- id: REV-020
  intent: latest_revenue
  prompt: "What's our latest quarterly revenue number?"
  persona: exec
  expect:
    behavior: answer
    models: [sales_analytics]
    route_mode: includes
    decoys: [sales_sandbox]
    doc_decoys: [fy25_revenue_draft]
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue], 'Date'[Fiscal Quarter] = "FY2027 Q1"))
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: standard
  tags: [decoy, time-relative]
  notes: >-
    Policy: 'latest quarter' = last complete fiscal quarter (FY2027 Q1 = Jul-Sep 2026 at data
    freeze); update when the data window moves

# --- Time intelligence ----------------------------------------------------------------------------

- id: TI-004
  intent: gross_revenue_yoy
  prompt: "How much did gross revenue grow year over year in FY2025?"
  persona: exec
  expect:
    behavior: answer
    models: [sales_analytics]
    route_mode: includes
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue YoY %], 'Date'[Fiscal Year] = "FY2025"))
      unit: percent
      tolerance: {abs: 0.001, display_aware: true}
  runs: 3
  criticality: standard
  tags: [time-intelligence]

# --- RLS persona ----------------------------------------------------------------------------------

- id: REV-010
  intent: gross_revenue_fy
  prompt: "What was gross revenue in FY2025?"
  persona: east
  expect:
    behavior: answer
    models: [sales_analytics]
    route_mode: includes
    value:
      # Executed as `east`, so row-level security limits the expected value to the East region.
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2025"))
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: critical
  tags: [rls]

# --- Cross-model ----------------------------------------------------------------------------------

- id: X-001
  intent: incidents_vs_revenue
  prompt: "In Q2 FY2025, which region had the most Sev1 incidents, and what was that region's gross revenue?"
  persona: exec
  expect:
    behavior: answer
    models: [service_operations, sales_analytics]
    route_mode: includes
    decoys: [sales_sandbox]
    value:
      # Two-step ground truth: region = TOPN(1, Sev1 incidents by region) from Service Operations,
      # then Gross Revenue for that region and quarter from Sales Analytics.
      composite: top_sev1_region_gross_revenue
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: standard
  tags: [cross-model]
  notes: "Ground truth computed by a Python composite of two reference queries (ground_truth/composite.py, P2.4)"

# --- Clarification expected -----------------------------------------------------------------------

- id: CLR-001
  intent: vague_performance
  prompt: "How are we doing?"
  persona: exec
  expect:
    behavior: clarify
  runs: 3
  criticality: standard
  tags: [clarification]

# --- No access ------------------------------------------------------------------------------------

- id: NOA-001
  intent: gross_revenue_fy
  prompt: "What was revenue in FY2025?"
  persona: noaccess
  expect:
    behavior: no_access
    models: []
    decoys: [sales_sandbox]
    doc_decoys: [fy25_revenue_draft]
  runs: 3
  criticality: critical
  tags: [governance, decoy]
  notes: "Must not answer from the sandbox model or the draft document"

# --- Joint Work IQ + Fabric IQ (PLAN §4.4) ------------------------------------------------------
# The answer needs a seeded SharePoint document (a target or objective) AND a certified semantic
# model (the actual). It must cite the document, take the actual from the model, and never use the
# draft. Run after `evals deploy workiq` has seeded the documents and Copilot has indexed them (S8).

- id: JNT-001
  intent: revenue_vs_target
  prompt: "Did we hit our FY2025 gross revenue target?"
  paraphrases:
    - "How did FY2025 gross revenue compare with the approved target?"
  persona: exec
  expect:
    behavior: answer
    models: [sales_analytics]
    route_mode: includes
    decoys: [sales_sandbox, finance]
    doc_decoys: [fy25_revenue_draft]
    work_sources: [fy25_revenue_targets]
    work_facts: [fy25_revenue_targets.gross_revenue_target]
    citation: required
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2025"))
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: critical
  tags: [joint, work-iq, decoy]
  notes: "Actual 12,840,000 from Sales Analytics against the approved 12,500,000 target: hit by 2.7%"

- id: JNT-002
  intent: region_revenue_vs_target
  prompt: "How did the East region do against its FY2025 revenue target?"
  persona: east
  expect:
    behavior: answer
    models: [sales_analytics]
    decoys: [sales_sandbox]
    doc_decoys: [fy25_revenue_draft]
    work_sources: [fy25_revenue_targets]
    work_facts: [fy25_revenue_targets.east_gross_revenue_target]
    citation: required
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2025"))
      unit: currency_usd
      tolerance: {rel: 0.005, display_aware: true}
  runs: 3
  criticality: standard
  tags: [joint, work-iq, rls]
  notes: "Run as east, RLS limits the actual to East: 4,200,000 against the 4,000,000 target"

- id: JNT-003
  intent: sev1_mttr_vs_objective
  prompt: "Did we meet our Sev1 resolution-time objective in FY2025?"
  persona: exec
  expect:
    behavior: answer
    models: [service_operations]
    work_sources: [fy25_service_objectives]
    work_facts: [fy25_service_objectives.sev1_mttr_objective_hours]
    citation: required
    value:
      reference_dax: |
        EVALUATE ROW("v", CALCULATE([MTTR Hours], 'Date'[Fiscal Year] = "FY2025", 'Incident'[Severity] = 1))
      unit: hours
      tolerance: {abs: 0.05, display_aware: true}
  runs: 3
  criticality: standard
  tags: [joint, work-iq]
  notes: "Actual 7.2 hours from Service Operations against the 6-hour objective: missed"

- id: JNT-004
  intent: revenue_vs_target
  prompt: "Did we hit our FY2025 gross revenue target?"
  persona: noaccess
  expect:
    behavior: no_access
    models: []
    decoys: [sales_sandbox]
    doc_decoys: [fy25_revenue_draft]
  runs: 3
  criticality: critical
  tags: [joint, work-iq, governance, decoy]
  notes: "noaccess can read neither the targets memo nor the certified model; it must not answer from the draft"
