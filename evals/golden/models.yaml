# =============================================================================================
# Sources the tests route to or away from (PLAN §4.2)
#
# models     Power BI semantic models (Direct Lake). Three certified models own the business
#            domains; one decoy holds a stale, unendorsed copy that personas can still see, so it
#            is a real routing risk. Cases refer to models by key.
# documents  Microsoft 365 documents seeded into SharePoint by `evals deploy workiq` (PLAN §4.4):
#            work sources (role: source) hold facts Copilot should use and cite, such as approved
#            targets, while actual figures still come from the certified models; decoys (role:
#            decoy) must never be used. Their text is built from workiq/content.yaml and these facts.
#
# report_url / model_url are tenant-specific and are NOT committed: the harness resolves model
# keys to Fabric ItemIds and URLs at run time (P2.2). `owner` is shown next to every answer in
# the scorecard, so each answer carries its source and its owner (PLAN §9.6.3).
#
# Schema: src/copilot_evals/schemas.py, classes SemanticModelRef and DocumentRef.
# =============================================================================================

models:
  sales_analytics:
    display_name: Sales Analytics
    workspace: ws-eval-certified
    owner: Contoso Sales Operations (fictional)
    endorsement: certified        # or "promoted" if certification is not enabled for the builder (T11)
    report: Sales Analytics
    domains: [sales]
    # Owner of "revenue" (gross) and sales volume:
    # Gross Revenue, Units, Orders, Avg Order Value, Gross Revenue FYTD / PY / YoY %

  finance:
    display_name: Finance
    workspace: ws-eval-certified
    owner: Contoso Finance (fictional)
    endorsement: certified
    report: Finance
    domains: [finance]
    # Owner of net revenue and margin; the deliberate "revenue" ambiguity:
    # Net Revenue, COGS, Gross Margin, Gross Margin %, Operating Expense, Operating Margin %

  service_operations:
    display_name: Service Operations
    workspace: ws-eval-certified
    owner: Contoso Service Operations (fictional)
    endorsement: certified
    report: Service Operations
    domains: [service]
    # Incidents, Sev1 Incidents, MTTR Hours, Impacted Customers

  sales_sandbox:
    display_name: Sales Sandbox
    workspace: ws-eval-sandbox
    owner: Unowned sandbox (fictional)
    endorsement: "none"
    decoy: true
    report: Sales Sandbox
    domains: [sales]
    # Revenue and Units on a stale snapshot (data to 2025-03-31, +3% uplift). Must never be used.

documents:
  # Matched case-insensitively against citation and attribution titles, URLs and the answer text.
  fy25_revenue_targets:
    title: "FY2025 Revenue Targets - APPROVED.docx"
    role: source
    location: Contoso Planning site, Planning/FY2025 (readers exec and east)
    match:
      - "FY2025 Revenue Targets - APPROVED"
      - "FY2025%20Revenue%20Targets%20-%20APPROVED"
    facts:
      gross_revenue_target: {value: 12500000, unit: currency_usd, label: "FY2025 gross revenue target, company"}
      east_gross_revenue_target: {value: 4000000, unit: currency_usd, label: "FY2025 gross revenue target, East"}
      west_gross_revenue_target: {value: 3800000, unit: currency_usd, label: "FY2025 gross revenue target, West"}
      central_gross_revenue_target: {value: 2900000, unit: currency_usd, label: "FY2025 gross revenue target, Central"}
      international_gross_revenue_target:
        {value: 1800000, unit: currency_usd, label: "FY2025 gross revenue target, International"}

  fy25_service_objectives:
    title: "FY2025 Service Level Objectives.docx"
    role: source
    location: Contoso Planning site, Planning/FY2025 (readers exec and east)
    match:
      - "FY2025 Service Level Objectives"
      - "FY2025%20Service%20Level%20Objectives"
    facts:
      sev1_mttr_objective_hours: {value: 6, unit: hours, label: "Sev1 mean time to resolve objective"}
      sev2_mttr_objective_hours: {value: 16, unit: hours, label: "Sev2 mean time to resolve objective"}

  fy25_revenue_draft:
    title: "FY2025 revenue - DRAFT.docx"
    role: decoy
    location: Contoso All Company site, Finance Drafts (readers all personas)
    match:
      - "FY2025 revenue - DRAFT"
      - "FY2025%20revenue%20-%20DRAFT"
    facts:
      # Deliberately wrong: actual FY2025 gross revenue is 12,840,000 and net revenue about 11.9 million.
      draft_revenue: {value: 13600000, unit: currency_usd, label: "Preliminary FY2025 revenue (wrong)"}
