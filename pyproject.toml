# Project metadata and tool configuration. Ruff is configured in ruff.toml.
# Dependencies are managed with uv: `uv sync` installs runtime + dev dependencies into .venv.

[project]
name = "copilot-fabriciq-evals"
version = "0.1.0"
description = "Automated evaluation harness that proves Microsoft 365 Copilot routes business questions to the intended Power BI semantic model through Fabric IQ and returns the expected value."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Microsoft Corporation" }]
keywords = ["microsoft-365-copilot", "microsoft-fabric", "fabric-iq", "power-bi", "llm-evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Runtime dependencies used today. Later tasks add theirs (azure-ai-projects>=2.2.0 for the Foundry backend;
# openai for the L1 orchestrator and the local backend's AI judge; httpx, msal, azure-identity,
# azure-keyvault-secrets, azure-kusto-data, mcp, tenacity, deltalake, pandas) as they need them.
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
# `uv sync --extra setup`: sign-in for `evals deploy fabric` and `evals deploy workiq` (docs/deployment.md).
setup = ["azure-identity>=1.19"]
# `uv sync --extra spikes`: the Phase 0 spike scripts in spikes/ (spikes/README.md).
spikes = [
    "azure-ai-projects>=2.2.0",
    "azure-identity>=1.19",
    "httpx>=0.28",
    "mcp>=1.9",
    "msal>=1.31",
    "openai>=1.99",
]

[project.scripts]
evals = "copilot_evals.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "numpy>=2.1",       # tests run the nb_01 data generator outside Fabric
    "pandas>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "python-docx>=1.1", # scripts/build_workiq_documents.py
    "ruff>=0.11",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_evals"]

# ---------------------------------------------------------------------------------------------
# mypy: strict on src/ (PLAN Appendix A). Run with `uv run mypy src`.
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# azure-identity is an optional extra (`uv sync --extra setup`); CI type-checks without it.
module = ["azure.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------------------------
# pytest: tests/unit must never touch the network; tests/contract replays recorded fixtures.
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "contract: replays sanitised recordings of an external service; no network",
    "live: needs a configured tenant; never runs in CI",
]

[tool.coverage.run]
source = ["copilot_evals"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
