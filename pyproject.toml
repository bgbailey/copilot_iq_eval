[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfeval"
version = "0.1.0"
description = "Evaluation harness for Microsoft 365 Copilot Chat with Fabric IQ: routing, values, DAX and latency, with end-to-end telemetry in a Fabric Eventhouse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Copilot x Fabric IQ evaluation accelerator contributors" }]
keywords = ["microsoft-365-copilot", "microsoft-fabric", "fabric-iq", "evaluation", "llm-evaluation", "eventhouse", "foundry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
copilot = ["msal>=1.28"]
kusto = ["azure-kusto-data>=4.6", "azure-kusto-ingest>=4.6"]
judge = ["openai>=2,<3", "azure-identity>=1.19"]
sql = ["pyodbc>=5.1,<6"]
foundry = ["azure-ai-projects>=2.2,<3", "openai>=2,<3", "azure-identity>=1.19"]
all = [
  "msal>=1.28", "azure-kusto-data>=4.6", "azure-kusto-ingest>=4.6", "openai>=2,<3", "azure-identity>=1.19",
  "azure-ai-projects>=2.2,<3", "pyodbc>=5.1,<6",
]

[project.scripts]
cfeval = "cfeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfeval = ["kql/*.kql", "sample/*.csv"]
