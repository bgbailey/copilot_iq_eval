- id: Q09
  question: What was year-over-year gross revenue growth percentage in FY2025 compared with FY2024?
  case_type: scalar
  category: time-intelligence
  persona: executive
  intent:
    measure: yoy_growth_rate
  tags:
  - yoy-growth
  - revenue
  - fy25
  expected_artifact: Contoso FY25 Sales Model
  artifact_aliases:
  - Sales Analytics
  expected_model: Contoso FY25 Sales Model
  decoys:
  - Sales Sandbox
  expected: 7.0
  unit: percent
  rel_tol: 0.0
  abs_tol: 0.1
  expected_answer: Year-over-year gross revenue grew 7.0% in FY2025 ($12.84M vs $12.00M in FY2024).
  reference_dax: EVALUATE ROW("v", DIVIDE(CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2025") - CALCULATE([Gross
    Revenue], 'Date'[Fiscal Year] = "FY2024"), CALCULATE([Gross Revenue], 'Date'[Fiscal Year] = "FY2024")) * 100)
  criticality: critical
  paraphrases:
  - By what percentage did gross revenue grow year over year from FY2024 to FY2025?
  - Calculate Contoso FY2025 YoY gross revenue growth rate in percent.
  notes: Exact 7.0% YoY increase from $12.00M to $12.84M
