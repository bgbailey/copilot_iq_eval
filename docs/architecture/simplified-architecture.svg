<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" viewBox="0 0 1380 740" width="1380" height="740">
  <title id="arch-title">Copilot x IQ Evaluation Accelerator — Target-Neutral v2 Pipeline Architecture</title>
  <desc id="arch-desc">End-to-end architecture showing Golden Suites (contoso.yaml, contoso-work.yaml, schemas/golden.schema.json) feeding Pluggable Targets (copilot-chat, transcript-import, mcp-agent, fabric-data-agent), corroborated by Evidence Sources (Workspace Monitoring KQL, Citations, MCP Tool Calls), evaluated by Dual Scoring Backends (fabric-native deterministic cascade plus calibrated judge, and foundry evaluators) under Gate Policies (with_engine_evidence, without_engine_evidence), and emitting Outputs (Eventhouse / JSONL, HTML Report, React Scorecard, OTel Spans, CI Compare Gate).</desc>
