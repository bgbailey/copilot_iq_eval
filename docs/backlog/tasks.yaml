        follows in P10.1
      - '`uv run evals validate --strict` passes'
      - >-
        Definition of done (Appendix A): `uv run ruff check && uv run mypy src && uv run pytest` pass; docs and
        ADRs updated if behaviour or contracts changed
    acceptance_source: derived
    notes: >-
      Plan inconsistency to settle first (record the decision in an ADR): PLAN §9.6.1 says '"$13M" for 12.84M fails
      at a 5% cap', but with the stated rule `(step / 2) / |expected| > max_display_rel` the half-step is 0.5M /
      12.84M = 3.9%, which is under 5%, so the answer would pass. Either the rule should compare the full step (1M
      / 12.84M = 7.8%) or the example is wrong.
