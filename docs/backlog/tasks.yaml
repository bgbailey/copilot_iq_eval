# =============================================================================================
# Backlog: every task in the implementation plan, as data (PLAN §0 step 3, §8).
#
# `scripts/bootstrap_github.py` turns this file into GitHub labels, milestones (one per phase) and
# issues (one per task, titled "[<id>] <title>"). Plan text is copied verbatim: `description`
# from the PLAN §8 task tables, `prompt` from the plan's Copilot prompts, and acceptance criteria
# marked `acceptance_source: plan` from the plan's phase acceptance lines. Criteria marked
# `derived` are written from the task description, because the plan gives none for that task.
#
#   status     todo | partial | done   (partial/done: `delivered` lists what the bootstrap built)
#   executor   copilot | manual        (manual = needs a person in the tenant)
#   depends_on suggested order; the plan does not prescribe dependencies
#
# Change the plan and this file together, in one pull request.
# =============================================================================================

version: 1

labels:
  - name: type:task
    color: 1d76db
    description: Build task from the implementation plan

  - name: type:spike
    color: 5319e7
    description: 'Phase 0 spike: answer an open question and record an ADR'

  - name: type:manual
    color: d93f0b
    description: 'Needs a person in the tenant: licences, admin settings, consent or UI-only setup'

  - name: type:bug
    color: b60205
    description: Something does not work as described

  - name: type:golden-case
    color: fbca04
    description: Proposal for the golden set

  - name: copilot-ready
    color: 0e8a16
    description: Has a Copilot prompt from the plan; can be assigned to GitHub Copilot

  - name: bootstrap:partial
    color: c2e0c6
    description: Partly delivered by the repository bootstrap; the issue lists what remains

  - name: layer:L0
    color: bfd4f2
    description: 'Data truth: the semantic model itself'

  - name: layer:L1
    color: bfd4f2
    description: 'Tool layer: Fabric IQ tools via the reference orchestrator'

  - name: layer:L2
    color: bfd4f2
    description: 'Agent: declarative agent (or Copilot Studio agent)'

  - name: layer:L3
    color: bfd4f2
    description: 'Copilot surfaces: Chat API, Teams, web and desktop'

  - name: area:agents
    color: ededed
    description: Declarative agent, routing policy, Copilot Studio

  - name: area:auth
    color: ededed
    description: Persona and daemon credentials

  - name: area:ci
    color: ededed
    description: GitHub Actions workflows and gates

  - name: area:docs
    color: ededed
