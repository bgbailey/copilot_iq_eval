  - name: area:scoring
    color: ededed
    description: Evaluators, the AI judge, both backends and verdicts

milestones:
  - key: P0
    title: Phase 0 — Spikes
    days: 1-3
    description: >-
      De-risk the preview services before building on them. Every spike ends in an ADR; confirmed contracts move
      into config/contracts.yaml.
    exit_criteria:
      - Spikes S1-S8 answered and recorded as ADR-001 to ADR-006, ADR-008 and ADR-011
      - config/contracts.yaml updated with every confirmed contract

  - key: P1
    title: Phase 1 — Fabric foundation
    days: 3-6
    description: >-
      Synthetic Contoso data, the four Direct Lake semantic models (three certified, one decoy), Prep data for AI,
      the expected-value snapshot, and the Work IQ documents for the joint cases, deployed by `evals deploy fabric`
      and `evals deploy workiq`.
    exit_criteria:
      - models query correctly
      - RLS verified for `east`
      - '`expected_snapshot.json` committed'
      - monitoring Eventhouse shows `SemanticModelLogs` rows for validation queries

  - key: P2
    title: Phase 2 — Harness core
    days: 5-9
    description: >-
      The harness core: scaffold, data contracts, auth, live ground truth, the evaluators and both evaluation backends
      (Microsoft Foundry and local), and the runner and gate.
    exit_criteria:
      - >-
        `evals run --suite pr --surfaces fake` runs end to end with fake adapters on both backends (the local backend
        with a fake judge, the Foundry backend with a fake client)
      - >-
        against a real Foundry project the run produces a report page, and the local backend gives the same outcome
        for every code-based evaluator on the same rows
      - all unit tests pass
      - mypy is clean

  - key: P3
    title: Phase 3 — L1 reference orchestrator
    days: 8-11
    description: >-
      L1: a controlled reference orchestrator (Azure OpenAI model + Fabric IQ MCP) with full tool traces, sharing
      the agent's routing policy.
    exit_criteria:
      - 10 golden cases run at L1 for `exec` and `east`
      - the trace shows the model ID used
      - routing is scored from both trace and logs

  - key: P4
    title: Phase 4 — L2 declarative agent and Agent Evaluations CLI
    days: 10-14
    description: >-
      L2: the Microsoft 365 Copilot declarative agent with the Fabric capability, driven per persona by the Agent
      Evaluations CLI.
    exit_criteria:
      - the nightly suite runs every L2 case for all personas without interaction
      - engine-log routing evidence is attached to each attempt

  - key: P5
    title: Phase 5 — Evidence and correlation
    days: 12-15
    description: >-
      Engine-log evidence: which semantic model each attempt actually queried, with heartbeat-based completeness.
    exit_criteria: []

  - key: P6
    title: 'Phase 6 — L3: Copilot Chat API and access-point consistency'
    days: 14-17
    description: >-
      L3: base Copilot Chat through the Chat API, and access-point consistency from tester sessions and audit.
    exit_criteria: []

  - key: P7
    title: Phase 7 — Optional adapters
    days: 16-18
    description: >-
      Optional adapters: Copilot Studio (only if ADR-004 is positive) and Fabric data agent diagnostics.
    exit_criteria: []

  - key: P8
    title: Phase 8 — Results and reporting
    days: 17-20
    description: Results in OneLake, the Power BI scorecard, and alerts.
    exit_criteria: []

  - key: P9
    title: Phase 9 — CI/CD
    days: 19-22
    description: >-
      CI/CD: the PR gate, nightly and reconcile workflows, the self-hosted runner and baseline handling.
    exit_criteria: []

  - key: P10
    title: Phase 10 — Demo hardening
    days: 21-25
    description: Judge calibration, scripted regression injections and the demo runbook.
    exit_criteria:
      - >-
        At least 40 golden cases (12 or more intents with paraphrases) across 3 certified models, 1 decoy model,
        1 document decoy, 2 seeded work sources and 3 personas.
      - The L0–L1 suite runs unattended on every pull request in under 15 minutes.
      - >-
        The L2 suite (a declarative agent driven by the Agent Evaluations CLI) runs unattended every night on a
        self-hosted runner.
      - >-
        A Power BI scorecard shows pass rates by surface and persona, a routing confusion matrix and drift over
        time.
      - The three scripted regression injections in §12 are detected and explained.
      - >-
        Every verdict is recorded with the evaluator version that produced it: in a Microsoft Foundry evaluation
        run with a report page (Foundry path) or in the run's artifacts (local path), and in the Lakehouse on both
        paths.
      - The same evaluators give the same verdicts on both backends for the same evaluation rows.

tasks:
  - id: T1-T21
    title: Tenant prerequisites and setup checklist
    milestone: P0
    executor: manual
    labels:
      - type:manual
      - area:infra
    plan:
      - §6
      - §11
    status: todo
    description: >-
      Prepare the demo tenant: licences, capacity, Azure resources, tenant settings, personas and app registrations
      from the PLAN §6 checklist. Record anything that turns out differently from the plan (for example Copilot
      credits for the Agent Evaluations CLI, T4) in an ADR.
    acceptance:
      - >-
        **T1** Microsoft 365 Copilot licences: 3 personas + builder (M365 admin; needed in P0). Fabric IQ in Chat
        and the Fabric capability need a Microsoft 365 Copilot (premium) licence.
      - >-
        **T2** Power BI Pro for personas (if capacity < F64) (M365 admin; needed in P0). E5 includes Pro.
      - >-
        **T3** Fabric capacity F2 or larger (F8 recommended for nightly runs) (Azure + Fabric admin; needed in P0).
        Data agents need F2+/P1+; workspace monitoring needs capacity.
      - >-
        **T4** Copilot credits / usage-based billing for the Agent Evaluations CLI (M365 admin / Azure; needed in
        P0). The CLI consumes Copilot credits — **confirm** for an MCAPS tenant.
      - >-
        **T5** Azure subscription: a model deployment (e.g., `gpt-5-mini`) in an Azure OpenAI or Foundry resource,
        Key Vault, VM for the self-hosted runner, optional Application Insights; on the Foundry path, a Foundry
        project (Azure; needed in P0). The deployment serves the L1 orchestrator on both paths and the local backend's
        AI judge. On the Foundry path, the project hosts the evaluator catalog, the AI judge, runs and results;
        pick a region that supports Foundry batch evaluations. The CLI defaults to `gpt-5-mini` as judge.
      - >-
        **T6** "Fabric data available in Microsoft 365 Copilot" (M365 admin center; needed in P0). On by default;
        verify.
      - >-
        **T7** "Share Fabric data with your Microsoft 365 services" (Fabric admin portal; needed in P0). Discoverability;
        on by default when geos match.
      - >-
        **T8** Cross-geo processing for Azure OpenAI (Fabric admin; needed in P0). Only for tenants outside the
        US or EU.
      - '**T9** "Dataset Execute Queries REST API" (Fabric admin; needed in P0). Ground truth.'
      - >-
        **T10** "Service principals can use Fabric APIs" (Fabric admin; needed in P0). Daemon writes results and
        reads monitoring.
      - >-
        **T11** Endorsement: certification enabled for the builder (Fabric admin; needed in P1). Otherwise use Promoted.
      - >-
        **T12** Custom app upload / agent sharing allowed for personas (Teams / M365 admin; needed in P4). Sideloading
        the declarative agent.
      - '**T13** Purview audit on (default) (Purview; needed in P6). CopilotInteraction records.'
      - >-
        **T14** Copilot Studio licence or trial (optional path) (Power Platform admin; needed in P7). Only if S4
        is positive.
      - >-
        **T15** Data agent tenant setting (optional path) (Fabric admin; needed in P7). Only for P7.2.
      - '**T16** Personas created, licensed, MFA registered (Entra; needed in P0). See §11.'
      - >-
        **T17** App registrations + admin consent (Entra; needed in P0). See §11. `infra/entra/New-EvalAppRegistrations.ps1`
        creates `copilot-eval-public`, `copilot-eval-setup` (for `evals deploy`), `copilot-eval-daemon` and `copilot-eval-ci`;
        consent stays a deliberate step.
      - >-
        **T18** Foundry path only: Foundry User role (formerly Azure AI User) for the builder and the runner identity,
        at the Foundry account scope (Azure; needed in P0). Needed to register evaluators and create runs; a project-only
        assignment doesn't let a run call the judge deployment.
      - >-
        **T19** Model access for the builder and the runner identity: Foundry User on a Foundry resource, or Cognitive
        Services OpenAI User on an Azure OpenAI resource (Azure; needed in P0). The L1 orchestrator (both paths)
        and the local backend's AI judge call the deployment with Microsoft Entra ID. `infra/azure` assigns the
        right role for the resource kind [S41, S38].
      - >-
        **T20** SharePoint sites for the Work IQ content: Contoso Planning (members exec, east) and Contoso All
        Company (all personas) (SharePoint admin; needed in P1). URLs go to `[workiq.sites]`; `evals deploy workiq`
        uploads the documents (§4.4).
      - >-
        **T21** Work IQ enabled for the tenant, with usage-based billing, for the Work IQ API surface in spike S8
        (M365 admin / Azure; needed in P0). Only for the `workiq` surface; the Chat API and agent surfaces don't
        need it [S42].
    acceptance_source: plan

  - id: P0.1
    title: Spike scripts for S1, S2, S3, S6, S7 and S8
    milestone: P0
    executor: copilot
    labels:
      - type:spike
      - area:harness
      - copilot-ready
      - bootstrap:partial
    plan:
      - §8 Phase 0
      - §9.3.1
      - §9.3.3
      - §9.5
      - §9.11
      - §4.4
    status: partial
    description: >-
      Standalone scripts under `spikes/` that run the Phase 0 spikes S1, S2, S3, S6, S7 and S8 and save their outputs
      for the ADRs.
    prompt: |
      Create `spikes/` with five standalone Python scripts: `s1_chat_api.py`, `s2_engine_logs.py`, `s6_fabriciq_mcp.py`, `s7_foundry_eval.py` and `s3_cli_probe.ps1`/`.sh`. Use msal PublicClientApplication with device-code flow and a file token cache per persona under `.cache/` (gitignored). For S1, follow §9.3.3 exactly and print the response `text` and every `attributions[]` item. For S6, follow §9.3.1: connect with `mcp.client.streamable_http.streamablehttp_client`, send headers `Authorization` and `X-Variants: Fabric.Routing.FabricIQ.V1`, print `tools/list` names and input schemas, then call `DiscoverArtifacts` with the query "Sales Analytics". For S2, use `azure-kusto-data` against the monitoring Eventhouse query URI from settings and run the KQL in §9.5 for a given UPN and window. For S7, follow §9.11: register the evaluators in `evals/evaluators/` under a `spike_` name prefix, upload three sanitised rows from `spikes/fixtures/s7_items.jsonl` (create them: a pass, a fail and a row with incomplete evidence), run `eval-definition.yaml`, and save the run, the output items and the report URL. No secrets in code; read settings from `config/settings.toml`.
    delivered:
      - >-
        `spikes/_common.py` (settings, MSAL device-code sign-in with a token cache per persona, raw output to `spikes/out/`)
        and one script per spike: `s1_chat_api.py`, `s2_engine_logs.py`, `s3_cli_probe.sh` / `.ps1`, `s6_fabriciq_mcp.py`,
        `s7_foundry_eval.py`, `s8_workiq_grounding.py`
      - >-
        S7 reuses the repository's own evaluator definitions and sample rows, so it tests exactly what the harness
        runs
      - >-
        `uv sync --extra spikes` installs their dependencies; `spikes/README.md` says how to run each one
    acceptance:
      - each script runs from the command line
      - outputs are saved to `spikes/out/` as JSON
      - ADR templates are filled in
    acceptance_source: plan
    notes: >-
      `spikes/out/` is gitignored because outputs contain tenant identifiers. Summarise findings in the ADRs; commit
      only sanitised examples.
    depends_on:
      - T1-T21

